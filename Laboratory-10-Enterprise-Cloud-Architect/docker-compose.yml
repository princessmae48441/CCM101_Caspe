
services:
  db:
    image: mysql:8.0
    container_name: cloudnova_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql          # persistent database storage
    networks:
      - wp_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: MySQL is reachable only inside wp_net.

  wordpress:
    image: wordpress:latest
    container_name: cloudnova_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy      # start only after MySQL is healthy
    ports:
      - "80:80"                         # the only published port
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_data:/var/www/html           # persistent site files and uploads
    networks:
      - wp_net

volumes:
  db_data:
  wp_data:

networks:
  wp_net:
